      parameters: [{ name: techniqueId, in: path, required: true, schema: { type: string, pattern: "^dao_[a-p]{16}$" } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/dao-lab/techniques/{techniqueId}/scrolls:
    post:
      tags: [DaoLab]
      summary: The author inscribes a tradable scroll of the technique (costs stones and a material).
      parameters: [{ name: techniqueId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [characterId], properties: { characterId: { type: string, format: uuid } } } } }
      responses:
        "201": { description: Scroll created in the author's bag }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/dao-lab/techniques:
    get:
      tags: [DaoLab]
      summary: Dao techniques the character knows (designed or learned) — equippable through the loadout.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/dao-lab/designs:
    post:
      tags: [DaoLab]
      summary: Create a technique from approved components within the power budget (design fee; at most 6 per character).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DaoDesign" } } } }
      responses:
        "201": { description: Designed and known by the author }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/dao-lab/scrolls/{instanceId}/learn:
    post:
      tags: [DaoLab]
      summary: Read a scroll from the bag — learn its technique; the scroll is used up (kept if already known).
      parameters:
        - { $ref: "#/components/parameters/CharacterId" }
        - { name: instanceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [expectedVersion], properties: { expectedVersion: { type: integer } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/sects/rules:
    get:
      tags: [Sects]
      summary: "Sect rules (founding fee, member limit, seat cost and cooldown)."
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/sects:
    get:
      tags: [Sects]
      summary: Active sects, newest first (?before=&limit=).
      parameters:
        - { name: before, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: OK }
    post:
      tags: [Sects]
