openapi: 3.1.0
info:
  title: Jianghu Go API
  version: 1.0.0-stage5
  description: |
    Authoritative game server API. Only endpoints implemented and covered by tests are listed here;
    tests/IntegrationTests/ContractTests verifies that this file and the running server expose the
    same set of routes. All timestamps are UTC ISO 8601. Errors are RFC 9457 application/problem+json
    with a stable `code` extension and the request `correlationId`.
servers:
  - url: http://localhost:8080
security:
  - bearer: []
tags:
  - name: Operations
  - name: Identity
  - name: Characters
  - name: Cultivation
  - name: Notifications
  - name: Combat
  - name: Exploration
  - name: World
  - name: Inventory
  - name: Crafting
  - name: Market
  - name: DaoLab
  - name: Sects
  - name: Territory
  - name: Arts
  - name: Estate
  - name: Social
paths:
  /ops/metrics:
    get:
      tags: [Operations]
      summary: Aggregate analytics for operators (X-Ops-Key; 404 when not configured).
      security: []
      responses:
        "200": { description: OK }
        "404": { description: Disabled or wrong key }
  /ops/reports:
    get:
      tags: [Operations]
      summary: Open player reports (moderation queue).
      security: []
      responses:
        "200": { description: OK }
        "404": { description: Disabled or wrong key }
  /ops/reports/{id}/decision:
    post:
      tags: [Operations]
      summary: Record a moderation decision.
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Decided }
        "400": { description: Invalid decision }
        "404": { description: Not found, disabled or wrong key }
  /health/live:
    get:
      tags: [Operations]
      security: []
      summary: Liveness probe (process is up).
      responses:
        "200": { description: Healthy, content: { text/plain: { schema: { type: string } } } }
  /health/ready:
    get:
      tags: [Operations]
      security: []
      summary: Readiness probe (storage reachable).
      responses:
        "200": { description: Healthy }
        "503": { description: Unhealthy }
  /health/economy:
    get:
      tags: [Operations]
      security: []
      summary: |
        Economy reconciliation (every wallet and stack equals the sum of its ledger). Scans the ledgers: poll slowly
        (e.g. every 5 min) and expose only on the internal network (see docs/operations/observability.md).
      responses:
        "200": { description: Healthy }
        "503": { description: A projection disagrees with its ledger }
  /api/v1/auth/register:
    post:
      tags: [Identity]
      security: []
      summary: Create an account. Rate limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterResponse" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { description: Body larger than 64 KiB }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login:
    post:
      tags: [Identity]
      security: []
      summary: Exchange credentials for an opaque token pair. Locks the account after repeated failures.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/refresh:
    post:
      tags: [Identity]
      security: []
      summary: Rotate the token pair. Reusing a rotated refresh token revokes the whole session family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/recovery-code:
    post:
      tags: [Identity]
      summary: Create a one-time recovery code (shown once; replaces the previous one).
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/reset-password:
    post:
      tags: [Identity]
      summary: Reset the password with e-mail and recovery code; ends every session.
      security: []
      responses:
        "204": { description: Reset }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/change-password:
    post:
      tags: [Identity]
      summary: Change the password (current one required); other sessions end.
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      tags: [Identity]
      summary: Revoke the current session family (all tokens derived from this login).
      responses:
        "204": { description: Revoked }
        "401": { description: Unauthenticated }
  /api/v1/characters:
    get:
      tags: [Characters]
      summary: List the caller's characters.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Character" } }
  /api/v1/characters/{characterId}:
    get:
      tags: [Characters]
      summary: Get one of the caller's characters. Other accounts' characters return 404.
      parameters:
        - { name: characterId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/drafts:
    post:
      tags: [Characters]
      summary: Return the active draft or create one (free initial server roll; grants initial Destiny Tokens once).
      responses:
        "200": { description: Existing draft, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "201": { description: New draft, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/drafts/current:
    get:
      tags: [Characters]
      summary: Get the active draft.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/drafts/{draftId}/reroll:
    post:
      tags: [Characters]
      summary: Reroll unlocked traits and stats. Costs Destiny Tokens; idempotent per Idempotency-Key.
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, description: Optimistic concurrency token from the draft. }
                lockedCategories:
                  type: array
                  items: { type: string, enum: [background, bloodline, constitution] }
      responses:
        "200": { description: Rerolled (or replay of a previous identical request), content: { application/json: { schema: { $ref: "#/components/schemas/Draft" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/drafts/{draftId}/finalize:
    post:
      tags: [Characters]
      summary: Turn the draft into a character with a name and cultivation path. Idempotent per Idempotency-Key.
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, name, path]
              properties:
                expectedVersion: { type: integer }
                name: { type: string, minLength: 2, maxLength: 24 }
                path: { type: string, enum: [qi, body, flame, poison] }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Character" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/game-config/character-creation:
    get:
      tags: [Characters]
      summary: Public part of the character creation rules (trait catalogue, stat ranges, reroll costs).
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/cultivation:
    get:
      tags: [Cultivation]
      summary: Cultivation state of one of the caller's characters (initial state if it never cultivated).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Cultivation" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/cultivation/meditation/start:
    post:
      tags: [Cultivation]
      summary: Start meditating at server time. Repeating while a session runs changes nothing.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Cultivation" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/cultivation/meditation/finish:
    post:
      tags: [Cultivation]
      summary: Finish the session; Qi is computed from server time (whole minutes, capped, daily cap). Idempotent per key.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  qiGained: { type: integer }
                  minutesCounted: { type: integer }
                  dailyCapReached: { type: boolean }
                  state: { $ref: "#/components/schemas/Cultivation" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/cultivation/steps:
    post:
      tags: [Cultivation]
      summary: Body path only. Report pedometer steps since the last report; implausible counts are clipped, not punished.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [steps]
              properties:
                steps: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  acceptedSteps: { type: integer }
                  clipped: { type: boolean }
                  qiGained: { type: integer }
                  state: { $ref: "#/components/schemas/Cultivation" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/cultivation/breakthrough:
    post:
      tags: [Cultivation]
      summary: Attempt a breakthrough. Server-side roll; failure costs part of the Qi and causes a Qi deviation. Idempotent per key.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        "200":
          description: Attempt resolved (success or failure)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  chance: { type: number }
                  qiSpent: { type: integer }
                  state: { $ref: "#/components/schemas/Cultivation" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/cultivation/breakthroughs:
    get:
      tags: [Cultivation]
      summary: History of breakthrough attempts.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: The caller's notifications, newest first, keyset-paginated.
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: before, in: query, description: "nextBefore from the previous page", schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  nextBefore: { type: [string, "null"], format: uuid }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark a notification as read (idempotent).
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "204": { description: Marked }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/social/friends:
    get:
      tags: [Social]
      summary: Friends, incoming and outgoing requests, unread counts.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Social]
      summary: Send a friend request by exact name (accepts if they asked first).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/social/friends/{otherId}/accept:
    post:
      tags: [Social]
      summary: Accept a friend request.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/social/friends/{otherId}:
    delete:
      tags: [Social]
      summary: Remove a friend, decline or withdraw a request.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/social/messages/{otherId}:
    get:
      tags: [Social]
      summary: Conversation with a friend (marks it read).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    post:
      tags: [Social]
      summary: Send a direct message to a friend (rate limited).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/social/mail:
    get:
      tags: [Social]
      summary: Received letters.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
    post:
      tags: [Social]
      summary: Send a letter to a friend with stones (5% courier fee) or tradable stackable items.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/social/mail/{mailId}/claim:
    post:
      tags: [Social]
      summary: Receive a letter's gifts.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: mailId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/social/blocks:
    get:
      tags: [Social]
      summary: Blocked cultivators.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/social/blocks/{otherId}:
    put:
      tags: [Social]
      summary: Block a cultivator (ends friendship; no requests, messages or letters from them).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Social]
      summary: Unblock.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { name: otherId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/social/reports:
    post:
      tags: [Social]
      summary: Report a player to the moderators (10 a day).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "204": { description: Reported }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/news:
    get:
      tags: [Social]
      summary: Jianghu news — notable deeds of cultivators (public names, no locations).
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer } }]
      responses:
        "200": { description: OK }
  /api/v1/bounties:
    get:
      tags: [Combat]
      summary: Open bounties (biggest first).
      parameters: [{ name: characterId, in: query, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
    post:
      tags: [Combat]
      summary: Put an escrowed bounty on a cultivator; a duel or arena victory over them pays it out.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/bounties/{bountyId}/withdraw:
    post:
      tags: [Combat]
      summary: Withdraw your unclaimed bounty (refund minus 10 %).
      parameters: [{ name: bountyId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/catalog:
    get:
      tags: [Combat]
      summary: Combat rules visible to players (techniques, slot layout, NPCs).
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/combat/loadout:
    get:
      tags: [Combat]
      summary: Equipped techniques (8 slots) and known techniques with mastery.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Loadout" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [Combat]
      summary: Replace the loadout (4 attack, 2 defense, 1 movement, 1 counter; known techniques only; no duplicates).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion, slots]
              properties:
                expectedVersion: { type: integer }
                slots: { type: array, minItems: 8, maxItems: 8, items: { type: [string, "null"] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Loadout" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/combat/battles:
    get:
      tags: [Combat]
      summary: Open battles (pending or active) of a character.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/pve:
    post:
      tags: [Combat]
      summary: Start a battle against an NPC. Idempotent per key; one active battle per character.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [characterId, npcId]
              properties:
                characterId: { type: string, format: uuid }
                npcId: { type: string }
      responses:
        "201": { description: Started, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/pvp:
    post:
      tags: [Combat]
      summary: Challenge another player's character. The opponent must accept before the challenge expires.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [characterId, opponentCharacterId]
              properties:
                characterId: { type: string, format: uuid }
                opponentCharacterId: { type: string, format: uuid }
      responses:
        "201": { description: Challenge created, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/{battleId}:
    get:
      tags: [Combat]
      summary: Battle as seen by the caller (own slots, opponent's visible state, last turn timeline). Applies elapsed deadlines.
      parameters: [{ $ref: "#/components/parameters/BattleId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/{battleId}/accept:
    post:
      tags: [Combat]
      summary: Accept a PvP challenge (challenged player only). Repeating returns the active battle.
      parameters: [{ $ref: "#/components/parameters/BattleId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/{battleId}/decline:
    post:
      tags: [Combat]
      summary: Decline (challenged) or withdraw (challenger) a pending challenge.
      parameters: [{ $ref: "#/components/parameters/BattleId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/{battleId}/actions:
    post:
      tags: [Combat]
      summary: |
        Submit this turn's intent: a slot (or null to rest) and, for the movement slot, a direction. The server
        validates turn number, ownership, cooldown, Qi and range, then resolves the turn when both sides have acted
        (PvE: immediately). One action per side per turn; the same Idempotency-Key replays the stored response.
      parameters: [{ $ref: "#/components/parameters/BattleId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [turn]
              properties:
                turn: { type: integer, minimum: 1 }
                slot: { type: [integer, "null"], minimum: 0, maximum: 7 }
                direction: { type: [string, "null"], enum: [advance, retreat, null] }
      responses:
        "200": { description: Accepted (and possibly resolved), content: { application/json: { schema: { $ref: "#/components/schemas/Battle" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/combat/battles/{battleId}/turns:
    get:
      tags: [Combat]
      summary: Full turn log (intents, timeline events, state after each turn). With the revealed seed it replays the battle.
      parameters: [{ $ref: "#/components/parameters/BattleId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/exploration:
    get:
      tags: [Exploration]
      summary: Current exploration session (aggregates only; the server keeps no location history).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExplorationSession" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/exploration/start:
    post:
      tags: [Exploration]
      summary: Start (or continue) an exploration session.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExplorationSession" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/exploration/stop:
    post:
      tags: [Exploration]
      summary: End the session. The last position is deleted.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExplorationSession" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/exploration/samples:
    post:
      tags: [Exploration]
      summary: |
        Batch of device GPS samples (max 20). Each is validated (range, accuracy, clock skew, age, order, rate, speed);
        an implausible jump moves the position but blocks rewards for a cooldown. Re-sending a batch is harmless.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [samples]
              properties:
                samples:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [lat, lon, accuracyM, capturedAt]
                    properties:
                      lat: { type: number, minimum: -90, maximum: 90 }
                      lon: { type: number, minimum: -180, maximum: 180 }
                      accuracyM: { type: number, exclusiveMinimum: 0 }
                      capturedAt: { type: string, format: date-time }
      responses:
        "200":
          description: Per-sample outcomes (accepted, accepted_low_accuracy, relocated, invalid, future, stale, out_of_order, rate_limited)
          content:
            application/json:
              schema:
                type: object
                properties:
                  outcomes: { type: array, items: { type: string } }
                  session: { $ref: "#/components/schemas/ExplorationSession" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/world/nearby:
    get:
      tags: [World]
      summary: Nodes within 600 m of the last known position, the active regional event and the nearest Flame site.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/world/flame-sites:
    get:
      tags: [World]
      summary: The 12 fixed Flame-path sites.
      responses:
        "200": { description: OK }
  /api/v1/world/interactions:
    post:
      tags: [World]
      summary: |
        Harvest a node or engage a spirit beast (returns battleId). Requires a verified position within 40 m, a node of the
        current spawn period, one claim per node and character, and the hourly limit. Node keys go in the body (never URLs/logs).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [characterId, nodeKey]
              properties:
                characterId: { type: string, format: uuid }
                nodeKey: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorldInteraction" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/world/flame-attunements:
    post:
      tags: [World]
      summary: Attune at a Flame site (verified position within 150 m; once per site per 20 h; Flame path earns most).
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [characterId, siteId]
              properties:
                characterId: { type: string, format: uuid }
                siteId: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/WorldInteraction" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/items:
    get:
      tags: [Inventory]
      summary: Item catalog (current items rules version), currency and bag limits.
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/inventory:
    get:
      tags: [Inventory]
      summary: Bag (stacks and unique items), Spirit Stones balance, equipped slots and total equipment bonuses.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inventory" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/inventory/equip:
    post:
      tags: [Inventory]
      summary: Equip a unique item from the bag (swaps with the item in the same slot). Optimistic version required.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EquipCommand" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inventory" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/inventory/unequip:
    post:
      tags: [Inventory]
      summary: Move an equipped item back to the bag (needs a free bag slot).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EquipCommand" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inventory" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/inventory/use:
    post:
      tags: [Inventory]
      summary: Consume 1-10 pills; Qi is credited asynchronously (exactly once) by Cultivation.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [itemId, quantity]
              properties:
                itemId: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/inventory/discard:
    post:
      tags: [Inventory]
      summary: Destroy stackable items (itemId + quantity) or one unique item from the bag (instanceId).
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                itemId: { type: [string, "null"] }
                quantity: { type: integer, minimum: 1 }
                instanceId: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Inventory" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/inventory/wallet:
    get:
      tags: [Inventory]
      summary: Spirit Stones ledger, newest first (keyset pagination with ?before=<entry id>&limit=1-200).
      parameters:
        - { $ref: "#/components/parameters/CharacterId" }
        - { name: before, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/inventory/items/{instanceId}/history:
    get:
      tags: [Inventory]
      summary: Provenance of a unique item (created, upgraded, listed, transferred …), visible to its current owner.
      parameters:
        - { $ref: "#/components/parameters/CharacterId" }
        - { name: instanceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/crafting/recipes:
    get:
      tags: [Crafting]
      summary: Recipes (forging never fails; alchemy chance + Insight bonus) and upgrade costs/chances per level.
      responses:
        "200": { description: OK }
  /api/v1/characters/{characterId}/crafting/craft:
    post:
      tags: [Crafting]
      summary: |
        Craft a recipe 1-10 times (unique items: once). Materials, stones and output move in one transaction;
        a missing input, stones or bag space consumes nothing. Rolls are server-side and logged with their seed.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipeId, times]
              properties:
                recipeId: { type: string }
                times: { type: integer, minimum: 1, maximum: 10 }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/crafting/upgrade:
    post:
      tags: [Crafting]
      summary: Upgrade a unique item by +1 (max +15). Costs 1 Refining Stone and 20 × target level stones; failure keeps the level.
      parameters: [{ $ref: "#/components/parameters/CharacterId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EquipCommand" } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/crafting/log:
    get:
      tags: [Crafting]
      summary: Crafting and upgrade history with seeds (newest first, ?before=&limit=).
      parameters:
        - { $ref: "#/components/parameters/CharacterId" }
        - { name: before, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/market/rules:
    get:
      tags: [Market]
      summary: Market rules (listing fee, sale tax, price range, listing lifetime, per-character listing limit).
      responses:
        "200": { description: OK }
  /api/v1/market/search:
    get:
      tags: [Market]
      summary: "Search active listings by name, type, rarity and max price; sort newest / unit_price / price."
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 40 } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: rarity, in: query, required: false, schema: { type: string } }
        - { name: maxPrice, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: sort, in: query, required: false, schema: { type: string, enum: [newest, unit_price, price] } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
  /api/v1/market/prices/{itemId}:
    get:
      tags: [Market]
      summary: Price history of an item (7 days of sales, cheapest offer).
      parameters: [{ name: itemId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/market/listings:
    get:
      tags: [Market]
      summary: Buyable listings, newest first (?itemId=&before=<listing id>&limit=1-100). Expired listings are hidden.
      parameters:
        - { name: itemId, in: query, required: false, schema: { type: string } }
        - { name: before, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Market]
      summary: |
        List a whole lot: a stack (itemId + quantity) or one unique item (instanceId + expectedVersion). The goods go into
        escrow and the non-refundable listing fee is charged in the same transaction.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [characterId, price]
              properties:
                characterId: { type: string, format: uuid }
                itemId: { type: [string, "null"] }
                quantity: { type: integer, minimum: 1 }
                instanceId: { type: [string, "null"], format: uuid }
                expectedVersion: { type: [integer, "null"] }
                price: { type: integer, minimum: 1 }
      responses:
        "201": { description: Listed }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/market/listings/{listingId}:
    get:
      tags: [Market]
      summary: One listing (any status).
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/market/listings/{listingId}/buy:
    post:
      tags: [Market]
      summary: |
        Buy a listing: price from the buyer, price minus tax to the seller, goods out of escrow, all in one transaction.
        Of concurrent buyers exactly one succeeds; the others get 409 listing_unavailable.
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [characterId], properties: { characterId: { type: string, format: uuid } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/market/listings/{listingId}/cancel:
    post:
      tags: [Market]
      summary: Seller withdraws an active or expired listing; goods return from escrow (fee not refunded).
      parameters: [{ name: listingId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [characterId], properties: { characterId: { type: string, format: uuid } } } } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/characters/{characterId}/market/listings:
    get:
      tags: [Market]
      summary: The character's own listings in every status, with fee, tax and proceeds.
      parameters:
        - { $ref: "#/components/parameters/CharacterId" }
        - { name: before, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/dao-lab/rules:
    get:
      tags: [DaoLab]
      summary: Dao Lab rules — component limits, power budget weights, design fee, scroll cost.
      responses:
        "200": { description: OK }
  /api/v1/dao-lab/preview:
    post:
      tags: [DaoLab]
      summary: Validate a design without saving it (points vs allowance and every problem found).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DaoDesign" } } } }
      responses:
        "200": { description: OK }
  /api/v1/dao-lab/techniques/{techniqueId}:
    get:
