components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque access token (prefix jga_), 15 min lifetime.
  parameters:
    BattleId:
      name: battleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,128}$" }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Stable machine-readable error code. }
        correlationId: { type: string }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
    RegisterResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    Trait:
      type: object
      properties:
        id: { type: string }
        category: { type: string, enum: [background, bloodline, constitution] }
        rarity: { type: string, enum: [common, rare, epic, legendary, mythic] }
        namePl: { type: string }
        nameEn: { type: string }
    Stat:
      type: object
      properties:
        id: { type: string, enum: [strength, spirit, agility, constitution, insight, willpower, focus, elementalAffinity, fate] }
        value: { type: integer }
    Draft:
      type: object
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        rulesVersion: { type: string }
        traits: { type: array, items: { $ref: "#/components/schemas/Trait" } }
        stats: { type: array, items: { $ref: "#/components/schemas/Stat" } }
        rerollCount: { type: integer }
        rerollsRemaining: { type: integer }
        destinyTokens: { type: integer }
        rerollBaseCost: { type: integer }
        rerollCostPerLockedTrait: { type: integer }
        maxLockedTraits: { type: integer }
    Character:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        path: { type: string, enum: [qi, body, flame, poison] }
        rulesVersion: { type: string }
        traits: { type: array, items: { $ref: "#/components/schemas/Trait" } }
        stats: { type: array, items: { $ref: "#/components/schemas/Stat" } }
        createdAt: { type: string, format: date-time }
    Cultivation:
      type: object
      properties:
        characterId: { type: string, format: uuid }
        path: { type: string, enum: [qi, body, flame, poison] }
        rulesVersion: { type: string }
        realmId: { type: string }
        realmNamePl: { type: string }
        stage: { type: integer }
        stagesInRealm: { type: integer }
        isPeak: { type: boolean }
        qi: { type: integer }
        qiRequired: { type: integer }
        breakthroughChance: { type: number }
        majorBreakthrough: { type: boolean }
        version: { type: integer }
        deviationUntil: { type: [string, "null"], format: date-time }
        meditationStartedAt: { type: [string, "null"], format: date-time }
        dailyMeditationQi: { type: integer }
        dailyMeditationQiCap: { type: integer }
        dailySteps: { type: integer }
        dailyStepCap: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [welcome, breakthrough_succeeded, breakthrough_failed, pvp_challenge, battle_won, battle_lost, battle_draw] }
        payload: { type: object, description: "Type-specific data; the client renders localised text." }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Loadout:
      type: object
      properties:
        characterId: { type: string, format: uuid }
        version: { type: integer }
        slots: { type: array, items: { $ref: "#/components/schemas/CombatSlot" } }
        known:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              namePl: { type: string }
              slot: { type: string }
              level: { type: integer, minimum: 1, maximum: 10 }
              xp: { type: integer }
              xpToNextLevel: { type: integer }
    CombatSlot:
      type: object
      properties:
        slot: { type: integer }
        kind: { type: string, enum: [attack, defense, movement, counter] }
        techniqueId: { type: [string, "null"] }
        namePl: { type: [string, "null"] }
        level: { type: integer }
        qiCost: { type: integer }
        cooldown: { type: integer }
        unavailable: { type: [string, "null"], description: "Why the slot cannot be used now (engine error code), null if usable." }
    Fighter:
      type: object
      properties:
        name: { type: string }
        hp: { type: integer }
        maxHp: { type: integer }
        qi: { type: integer }
        maxQi: { type: integer }
        effects: { type: array, items: { type: object } }
    Battle:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [pve, pvp] }
        status: { type: string, enum: [pending_acceptance, active, finished, declined, expired] }
        rulesVersion: { type: string }
        version: { type: integer }
        mySide: { type: string, enum: [a, b] }
        turn: { type: integer }
        distance: { type: integer }
        deadline: { type: string, format: date-time }
        me: { $ref: "#/components/schemas/Fighter" }
        opponent: { $ref: "#/components/schemas/Fighter" }
        mySlots: { type: array, items: { $ref: "#/components/schemas/CombatSlot" } }
        myActionSubmitted: { type: boolean }
        opponentActionSubmitted: { type: boolean }
        lastTurnEvents: { type: array, items: { type: object } }
        result: { type: [string, "null"], enum: [won, lost, draw, null] }
        npcId: { type: [string, "null"] }
        opponentCharacterId: { type: [string, "null"], format: uuid }
        seedHash: { type: string, description: "SHA-256 of the battle seed, published at the start." }
        seed: { type: [string, "null"], description: "Revealed when the battle has finished." }
        rewardQi: { type: integer }
    ExplorationSession:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, "null"], format: date-time }
        distanceM: { type: number }
        acceptedSamples: { type: integer }
        droppedSamples: { type: integer }
        anomalies: { type: integer }
        flagged: { type: boolean }
        positionVerified: { type: boolean }
        positionProblem: { type: [string, "null"], enum: [no_session, session_flagged, stale_position, low_accuracy, relocation_cooldown, moving_too_fast, null] }
        relocationUntil: { type: [string, "null"], format: date-time }
    WorldInteraction:
      type: object
      properties:
        kind: { type: string }
        rewardQi: { type: integer }
        battleId: { type: [string, "null"], format: uuid }
        items:
          type: [array, "null"]
          description: Materials gathered (credited to the bag asynchronously).
          items: { type: object, properties: { itemId: { type: string }, quantity: { type: integer } } }
    EquipCommand:
      type: object
      additionalProperties: false
      required: [instanceId, expectedVersion]
      properties:
        instanceId: { type: string, format: uuid }
        expectedVersion: { type: integer }
    Inventory:
      type: object
      properties:
        characterId: { type: string, format: uuid }
        rulesVersion: { type: string }
        balance: { type: integer, description: Spirit Stones. }
        slotsUsed: { type: integer }
        capacity: { type: integer }
        stacks: { type: array, items: { type: object } }
        items: { type: array, items: { type: object } }
        equipped: { type: object, additionalProperties: { type: string, format: uuid } }
        bonuses: { type: object, additionalProperties: { type: integer } }
    DaoDesign:
      type: object
      additionalProperties: false
      required: [name, slot, qiCost, cooldown, speed]
      description: Exactly one component matching the slot (attack | defense | movement | counter). Server validates limits and budget.
      properties:
        name: { type: string, minLength: 2, maxLength: 32 }
        slot: { type: string, enum: [attack, defense, movement, counter] }
        qiCost: { type: integer }
        cooldown: { type: integer }
        speed: { type: integer }
        attack:
          type: [object, "null"]
          properties:
            power: { type: integer }
            scaling: { type: string, enum: [strength, spirit, agility] }
            rangeMin: { type: integer }
            rangeMax: { type: integer }
            accuracyPermille: { type: integer }
            effect: { type: [object, "null"], properties: { type: { type: string, enum: [bleed, stun, weaken] }, chancePermille: { type: integer }, magnitude: { type: integer }, duration: { type: integer } } }
        defense: { type: [object, "null"], properties: { blockPermille: { type: integer } } }
        movement: { type: [object, "null"], properties: { evasionPermille: { type: integer } } }
        counter: { type: [object, "null"], properties: { reflectPermille: { type: integer }, qiSteal: { type: integer } } }
