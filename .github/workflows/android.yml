name: android-apk

# Builds a debug-signed DEVELOPMENT APK of the Unity client with GameCI.
# Requires repository secrets with a (free) Unity Personal licence:
#   UNITY_LICENSE  – contents of the Unity_lic.ulf file,
#   UNITY_EMAIL, UNITY_PASSWORD – the Unity account the licence belongs to.
# Run manually (Actions → android-apk → Run workflow) or push a tag v*; tags also attach the APK to a GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check Unity licence secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for v in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set (see the comment at the top of android.yml)"; missing=1; fi
          done
          exit $missing

      - name: Free disk space for the Unity Android image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" && df -h /

      - uses: actions/cache@v4
        with:
          path: client/JianghuGo.Unity/Library
          key: unity-library-android-${{ hashFiles('client/JianghuGo.Unity/Packages/manifest.json', 'client/JianghuGo.Unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: unity-library-android-

      - name: Build APK (Unity 6000.0.84f1, IL2CPP arm64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          JIANGHU_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.8.0' }}
        with:
          projectPath: client/JianghuGo.Unity
          unityVersion: 6000.0.84f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: JianghuGo
          buildMethod: JianghuGo.Editor.BuildAndroid.Build

      - name: Collect APK
        run: |
          mkdir -p dist
          find build client/JianghuGo.Unity/Builds -name '*.apk' -exec cp {} dist/JianghuGo.apk \; 2>/dev/null || true
          ls -la dist
          test -s dist/JianghuGo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JianghuGo-apk
          path: dist/JianghuGo.apk
          if-no-files-found: error

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JianghuGo.apk
