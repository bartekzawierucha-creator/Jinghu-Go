name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: jianghu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jianghu" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JIANGHU_TEST_POSTGRES: Host=localhost;Username=jianghu;Password=ci-only-password;Database=postgres
      World__Seed: "1234567890123"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build (warnings are errors)
        run: dotnet build server/JianghuGo.sln -c Release --nologo
      - name: Unit tests
        run: dotnet run --project server/tests/UnitTests -c Release --no-build
      - name: Integration suite on the in-memory store
        # failures are also published as annotations (readable through the API without the full log)
        run: |
          set -o pipefail
          dotnet run --project server/tests/IntegrationTests -c Release --no-build 2>&1 | tee it.txt || {
            grep -A3 "  FAIL" it.txt | grep -v '"Timestamp"' | head -60 | while IFS= read -r line; do echo "::error title=integration (InMemory)::$line"; done
            exit 1
          }
        env:
          JIANGHU_TEST_STORAGE: InMemory
      - name: Integration suite on PostgreSQL (incl. migrations and worker process)
        # failures are also published as annotations (readable through the API without the full log)
        run: |
          set -o pipefail
          dotnet run --project server/tests/IntegrationTests -c Release --no-build 2>&1 | tee it.txt || {
            grep -A3 "  FAIL" it.txt | grep -v '"Timestamp"' | head -60 | while IFS= read -r line; do echo "::error title=integration (Postgres)::$line"; done
            exit 1
          }
        env:
          JIANGHU_TEST_STORAGE: Postgres
      - name: Load smoke test (20 players, 30 s, 500 ms think time, real API on PostgreSQL; gate = no errors, gameplay p95 < 3 s)
        env:
          Storage__Provider: Postgres
          ConnectionStrings__Jianghu: Host=localhost;Username=jianghu;Password=ci-only-password;Database=postgres
          RateLimiting__AuthPermitsPerMinute: "100000"
          RateLimiting__GlobalPermitsPerMinute: "1000000"
          Worker__RunInProcess: "true"
          DOTNET_ENVIRONMENT: Staging
          ASPNETCORE_ENVIRONMENT: Staging
        run: |
          dotnet server/src/Api/bin/Release/net10.0/JianghuGo.Api.dll migrate
          dotnet server/src/Api/bin/Release/net10.0/JianghuGo.Api.dll --urls http://127.0.0.1:8080 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/health/ready && break; sleep 1; done
          dotnet run --project tools/load-test -c Release --no-build -- --url http://127.0.0.1:8080 --users 20 --seconds 30 --think-ms 500 --max-error-rate 0.01 --max-p95-ms 3000
      - name: Balance report (tribulation odds per path; informative, does not fail the build)
        continue-on-error: true
        run: |
          dotnet run --project server/tools/BalanceSim -c Release -- trib | tee balance-trib.txt
          echo "### Balance (tribulations)" >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 balance-trib.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Vulnerable dependency check
        run: dotnet list server/JianghuGo.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt && ! grep -q "has the following vulnerable packages" vuln.txt

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: jianghu
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jianghu" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrations, tamper detection and integrity tests
        env:
          ADMIN_URL: postgres://jianghu:ci-only-password@localhost:5432/postgres
        run: ./database/test.sh

      - name: Backup/restore drill (pg_dump → pg_restore → identical, reconciled, guarded)
        env:
          ADMIN_URL: postgres://jianghu:ci-only-password@localhost:5432/postgres
        run: ./database/backup-restore-test.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
