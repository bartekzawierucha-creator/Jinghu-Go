name: android-native-apk

# Builds the native Android client (.NET for Android, no Unity) into a debug-signed DEVELOPMENT APK.
# The APK is uploaded as a workflow artifact and attached to the rolling pre-release "android-latest".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["client/**", "server/src/**", "content/**", "tools/android-smoke/**", ".github/workflows/android-native.yml"]

permissions:
  contents: write

concurrency:
  group: android-native
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install the .NET Android workload
        run: dotnet workload install android
      - name: Publish the game server (embedded in the app for offline play)
        run: |
          dotnet publish server/src/Api -c Release -o "$RUNNER_TEMP/server-bin" --nologo -v q
          aspnet=$(ls -d "$DOTNET_ROOT"/shared/Microsoft.AspNetCore.App/10.* | sort -V | tail -n1)
          echo "SERVER_PROPS=-p:ServerBin=$RUNNER_TEMP/server-bin -p:AspNetDir=$aspnet" >> "$GITHUB_ENV"
          echo "ASP.NET Core: $aspnet"
      - name: Install Android SDK dependencies (platform, build-tools)
        run: dotnet build client/JianghuGo.Android/JianghuGo.Android.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" -p:AcceptAndroidSDKLicenses=True $SERVER_PROPS
      - name: Build APKs (one per CPU type, so each download stays small)
        run: |
          set +e
          mkdir -p dist
          for pair in android-arm64:JianghuGo-dev.apk android-arm:JianghuGo-dev-arm32.apk android-x64:JianghuGo-dev-x86_64.apk; do
            rid=${pair%%:*}; name=${pair#*:}
            dotnet publish client/JianghuGo.Android/JianghuGo.Android.csproj -f net10.0-android -c Release -p:Abi=$rid -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" $SERVER_PROPS -o out/$rid --nologo 2>&1 | tee build-$rid.log
            status=${PIPESTATUS[0]}
            if [ $status -ne 0 ]; then
              grep -E ": error |error [A-Z]+[0-9]+" build-$rid.log | sort -u | head -20 | sed 's/^/::error::/'
              exit $status
            fi
            cp "$(find out/$rid -name '*-Signed.apk' | head -n1)" "dist/$name"
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: JianghuGo-dev-apk
          path: dist/*.apk

  smoke:
    # Installs the APK on an emulator and plays through the main screens in offline mode (server inside the app).
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JianghuGo-dev-apk
          path: dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Play through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/android-smoke/smoke.sh dist/JianghuGo-dev-x86_64.apk
      - name: Pack screenshots and logs
        if: always()
        run: |
          (cd shots && zip -qr ../android-smoke.zip .) || true
      - name: Publish screenshots and logs (android-smoke pre-release)
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-smoke
          name: "Android smoke test — screenshots and logs"
          prerelease: true
          files: android-smoke.zip
          body: Screenshots and logs of the latest emulator smoke test (${{ github.sha }}).
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke
          path: shots/
      - name: Publish to the android-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "Jianghu Go — Android (development build)"
          prerelease: true
          files: |
            dist/JianghuGo-dev.apk
            dist/JianghuGo-dev-arm32.apk
          body: |
            Debug-signed DEVELOPMENT build of the native Android client from ${{ github.sha }}.
            Install: allow "unknown sources", open the APK. Server: `API_BIND=0.0.0.0 docker compose up --build` on a PC
            in the same Wi-Fi, then enter http://<PC address>:8080 on the login screen.
